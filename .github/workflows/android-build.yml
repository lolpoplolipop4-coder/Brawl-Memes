# Репозиторий: Brawl-Memes
# Положите этот файл сюда: .github/workflows/build-apk.yml
# В корень репозитория положите архив "Brawl_Memes_Godot (1).zip" (или сам проект - папки assets, scripts, project.godot и т.д.).
# Сборка запускается при каждом push в main/master и вручную (Actions -> Build Android APK -> Run workflow).
# Готовый APK появится в разделе Artifacts запуска.

name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  ZIP_NAME: "Brawl_Memes_Godot (1).zip"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Godot project (unzip if needed)
        id: proj
        run: |
          if [ -f project.godot ]; then
            DIR="."
          else
            ZIP="$ZIP_NAME"
            if [ ! -f "$ZIP" ]; then ZIP="$(ls ./*.zip | head -1)"; fi
            echo "Using archive: $ZIP"
            unzip -q "$ZIP" -d _project
            DIR="$(dirname "$(find _project -name project.godot | head -1)")"
          fi
          echo "Project dir: $DIR"
          test -f "$DIR/project.godot"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d _tpl
          mv _tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor for Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          # убираем отступы YAML в начале строк
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Create export preset (if the project has none)
        run: |
          DIR="${{ steps.proj.outputs.dir }}"
          if [ ! -f "$DIR/export_presets.cfg" ]; then
          cat > "$DIR/export_presets.cfg" <<'PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.brawlmemes.game"
          package/name="Brawl Memes"
          package/signed=true
          screen/immersive_mode=true
          permissions/internet=true
          permissions/vibrate=true
          PRESET
          sed -i 's/^ *//' "$DIR/export_presets.cfg"
          fi
          cat "$DIR/export_presets.cfg"

      - name: Import project resources
        run: |
          DIR="${{ steps.proj.outputs.dir }}"
          godot --headless --path "$DIR" --import || true

      - name: Export debug APK
        run: |
          DIR="${{ steps.proj.outputs.dir }}"
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/BrawlMemes-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/build"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrawlMemes-debug-apk
          path: build/BrawlMemes-debug.apk
          if-no-files-found: error
